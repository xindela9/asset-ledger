<style>
  :root{
    --bg1:#eef2ff;--bg2:#fdf2f8;--bg3:#f0fdf4;
    --grid:rgba(90,90,140,.05);
    --card-bg:#ffffff;--card-shadow:0 24px 60px -20px rgba(30,20,60,.25);
    --ink:#16211f;--ink-soft:#54635f;--ink-faint:#8a9793;
    --line:#e2e5ea;--line-focus:#4f6ef7;
    --brand:#1577cc;--brand-deep:#0e5fa8;--brand-tint:#e4f1fb;
    --red:#c0392b;
    --toggle-bg:#ffffff;--toggle-ink:#54635f;--toggle-shadow:0 4px 14px -4px rgba(30,20,60,.25);
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  }
  html[data-theme="dark"]{
    --bg1:#171923;--bg2:#1c1830;--bg3:#141a24;
    --grid:rgba(255,255,255,.04);
    --card-bg:#20222f;--card-shadow:0 24px 60px -20px rgba(0,0,0,.6);
    --ink:#eef1f4;--ink-soft:#a8b0bd;--ink-faint:#6b7280;
    --line:#33374a;--line-focus:#6d8dff;
    --brand:#3b8ee8;--brand-deep:#2f74c2;--brand-tint:#1e2a3d;
    --red:#f07167;
    --toggle-bg:#20222f;--toggle-ink:#c7cdd9;--toggle-shadow:0 4px 14px -4px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--sans);color:var(--ink);min-height:100vh;
    display:grid;place-items:center;-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(circle at 15% 15%, var(--bg1), transparent 55%),
      radial-gradient(circle at 85% 20%, var(--bg2), transparent 55%),
      radial-gradient(circle at 50% 90%, var(--bg3), transparent 55%),
      var(--card-bg);
    transition:background-color .25s ease;
  }
  .theme-toggle{
    position:fixed;top:20px;right:20px;width:40px;height:40px;border-radius:50%;
    background:var(--toggle-bg);box-shadow:var(--toggle-shadow);border:none;cursor:pointer;
    display:grid;place-items:center;color:var(--toggle-ink);transition:transform .15s ease;
  }
  .theme-toggle:hover{transform:scale(1.08)}
  .theme-toggle svg{width:19px;height:19px}
  .theme-toggle .sun{display:none}
  html[data-theme="dark"] .theme-toggle .sun{display:block}
  html[data-theme="dark"] .theme-toggle .moon{display:none}

  .card{
    background:var(--card-bg);width:100%;max-width:380px;border-radius:22px;
    box-shadow:var(--card-shadow);padding:34px 32px 30px;margin:16px;
    transition:background-color .25s ease;
  }
  .brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;margin-bottom:26px}
  .brand img{height:48px;display:block}
  .brand h1{font-size:19px;font-weight:650;letter-spacing:.2px}
  .brand .sub{font-size:12.5px;color:var(--ink-faint);margin-top:3px}
  label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:560;margin-top:16px}
  .input-wrap{position:relative}
  input{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
    font-size:14.5px;font-family:inherit;color:var(--ink);background:transparent;
  }
  input:focus{outline:none;border-color:var(--line-focus);box-shadow:0 0 0 3px var(--brand-tint)}
  .input-wrap input{padding-right:40px}
  .eye-btn{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;
    border:none;background:none;cursor:pointer;color:var(--ink-faint);display:grid;place-items:center;
    border-radius:7px;
  }
  .eye-btn:hover{background:var(--brand-tint);color:var(--ink-soft)}
  .eye-btn svg{width:18px;height:18px}
  button[type="submit"]{
    width:100%;margin-top:24px;padding:12px;border:none;border-radius:10px;
    background:var(--brand);color:#fff;font-size:15px;font-weight:600;font-family:inherit;
    cursor:pointer;transition:background .15s;
  }
  button[type="submit"]:hover{background:var(--brand-deep)}
  button[type="submit"]:disabled{opacity:.6;cursor:not-allowed}
  .err{color:var(--red);font-size:13px;margin-top:14px;min-height:18px;text-align:center}
  .tip{margin-top:18px;font-size:11.5px;color:var(--ink-faint);text-align:center;line-height:1.6}
</style>
</head>

      <div><h1>固定资产管理</h1><div class="sub">请登录后使用</div></div>
    </div>
    <label>账号</label>
    <input id="username" type="text" autocomplete="username" autofocus>
    <label>密码</label>
    <div class="input-wrap">
      <input id="password" type="password" autocomplete="current-password">
      <button type="button" class="eye-btn" id="eyeBtn" aria-label="显示/隐藏密码">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <button type="submit" id="submitBtn">登 录</button>
    <div class="err" id="err"></div>
  </form>

<script>
  // 主题切换：读取本地存储 / 系统偏好，点击按钮切换并记住选择
  (function(){
    const root=document.documentElement;
    const saved=localStorage.getItem("theme");
    const prefersDark=window.matchMedia("(prefers-color-scheme: dark)").matches;
    if(saved==="dark"||(!saved&&prefersDark)) root.setAttribute("data-theme","dark");
    document.getElementById("themeToggle").addEventListener("click",()=>{
      const isDark=root.getAttribute("data-theme")==="dark";
      if(isDark){root.removeAttribute("data-theme");localStorage.setItem("theme","light");}
      else{root.setAttribute("data-theme","dark");localStorage.setItem("theme","dark");}
    });
  })();

  // 密码显示/隐藏
  document.getElementById("eyeBtn").addEventListener("click",()=>{
    const p=document.getElementById("password");
    p.type = p.type==="password" ? "text" : "password";
  });

  // 登录逻辑（与原页面一致）
  const f=document.getElementById("loginForm");
  f.addEventListener("submit",async e=>{
    e.preventDefault();
    const btn=document.getElementById("submitBtn"),err=document.getElementById("err");
    err.textContent="";btn.disabled=true;btn.textContent="登录中…";
    try{
      const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({username:document.getElementById("username").value,password:document.getElementById("password").value})});
      if(r.ok){location.href="/";}
      else{const d=await r.json().catch(()=>({}));err.textContent=d.error||"登录失败";btn.disabled=false;btn.textContent="登 录";}
    }catch(e){err.textContent="连接服务器失败";btn.disabled=false;btn.textContent="登 录";}
  });
</script>
</body>
</html>
